services:
  mcp-server:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      MCP_OAUTH_CLIENT_ID: "mcp-client"
      MCP_OAUTH_CLIENT_SECRET: "mcp-secret-change-in-production"
      CORS_ORIGINS: "http://localhost:3001,http://localhost:3000"
